# Local development stack. All credentials below are dummy, local-only values.
services:
  db:                       # development database (persistent)
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: order_to_audit
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d order_to_audit"]
      interval: 5s
      retries: 10

  db-test:                  # disposable server for the test suite (data lives in RAM)
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/order_to_audit
      APP_ENV: dev
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]

volumes:
  pgdata:
